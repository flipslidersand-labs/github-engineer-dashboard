name: Go Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.25"
      working-directory: "backend-go"
      # First real threshold now that internal/{cache,github,handler} have
      # tests (Issue #127; measured ~45%). model/ is plain structs with no
      # logic, so it's excluded from the denominator naturally (no test file
      # needed). Raise this incrementally as coverage grows.
      coverage-threshold: 40
