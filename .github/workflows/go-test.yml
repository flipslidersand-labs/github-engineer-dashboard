name: Go Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.26"
      working-directory: "backend-go"
      # Measured total 75.4% (2026-11-03, after #173). Threshold sits ~5pt
      # below so regressions are caught without flaking. Raise as coverage grows.
      coverage-threshold: 70
